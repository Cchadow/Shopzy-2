name: Build Shopzy Haiti APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses & install API 36.1
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" || sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: 'basic'

      - name: Prepare environment and debug keystore
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk Shopzy-Haiti.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Shopzy-Haiti-APK
          path: Shopzy-Haiti.apk
          retention-days: 30

      - name: Publish Direct Download Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-apk --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload latest-apk Shopzy-Haiti.apk --repo "${{ github.repository }}" --clobber
          else
            gh release create latest-apk Shopzy-Haiti.apk \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "Shopzy Haiti APK" \
              --notes "Latest installable Android APK for Shopzy Haiti (no Google Play Console account required)."
          fi
